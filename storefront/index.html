<!doctype html>
<html lang="zh-CN" class="zs-config-pending">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" id="zs-favicon" href="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title></title>
    <script>
      try {
        var t = localStorage.getItem('dujiao_theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <style>
      html.zs-config-pending, html.zs-config-pending body { background: #f5f6f8 !important; color: #f5f6f8; }
      html.zs-config-pending.dark, html.zs-config-pending.dark body { background: #171a20 !important; color: #171a20; }
      body { margin: 0; }
      .zs-boot { min-height: 100vh; padding: 0 max(24px, calc((100vw - 1200px) / 2)); box-sizing: border-box; }
      .zs-boot-header { height: 72px; display: flex; align-items: center; gap: 12px; }
      .zs-boot-content { padding-top: min(12vh, 96px); }
      .zs-boot-block { display: block; border-radius: 12px; background: #e3e6eb; animation: zs-boot-pulse 1.4s ease-in-out infinite alternate; }
      .dark .zs-boot-block { background: #30343d; }
      .zs-boot-mark { width: 36px; height: 36px; }
      .zs-boot-name { width: 128px; height: 20px; }
      .zs-boot-heading { width: min(62%, 420px); height: 38px; margin-bottom: 22px; }
      .zs-boot-line { width: min(85%, 680px); height: 16px; margin-bottom: 12px; }
      .zs-boot-line-short { width: min(55%, 390px); }
      .zs-boot-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 56px; }
      .zs-boot-cards .zs-boot-block { height: 180px; }
      .zs-boot-error { margin-top: 30px; color: #4b5563; }
      .dark .zs-boot-error { color: #e5e7eb; }
      .zs-boot-error button { margin-top: 8px; border: 0; border-radius: 8px; padding: 8px 16px; background: #d5d9e0; color: #111827; cursor: pointer; }
      @keyframes zs-boot-pulse { to { opacity: .55; } }
      @media (max-width: 640px) { .zs-boot-cards { grid-template-columns: 1fr; } .zs-boot-cards .zs-boot-block { height: 120px; } }
      @media (prefers-reduced-motion: reduce) { .zs-boot-block { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app"><div class="zs-boot" aria-busy="true"><div class="zs-boot-header"><span class="zs-boot-block zs-boot-mark"></span><span class="zs-boot-block zs-boot-name"></span></div><div class="zs-boot-content"><div class="zs-boot-block zs-boot-heading"></div><div class="zs-boot-block zs-boot-line"></div><div class="zs-boot-block zs-boot-line zs-boot-line-short"></div><div class="zs-boot-cards"><div class="zs-boot-block"></div><div class="zs-boot-block"></div><div class="zs-boot-block"></div></div></div></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
