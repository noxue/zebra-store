[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0"

[workspace.dependencies]
zs-shared = { path = "crates/shared" }
zs-domain = { path = "crates/domain" }
zs-app = { path = "crates/app" }
zs-infra = { path = "crates/infra" }
zs-migration = { path = "crates/migration" }
zs-api = { path = "crates/api" }
huifu-pay = "0.2"

tokio = { version = "1.53", features = ["full"] }
axum = { version = "0.8", features = ["multipart", "macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "fs", "trace", "request-id", "util", "timeout"] }
sea-orm = { version = "2.0", features = ["sqlx-sqlite", "sqlx-mysql", "sqlx-postgres", "runtime-tokio-rustls", "macros", "with-json", "with-chrono", "with-rust_decimal", "schema-sync", "entity-registry"] }
sea-orm-migration = { version = "2.0", features = ["sqlx-sqlite", "sqlx-mysql", "sqlx-postgres", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
rust_decimal = { version = "1.43", features = ["serde-with-str", "maths"] }
rust_decimal_macros = "1.37"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
md-5 = "0.10"
aes-gcm = "0.10"
async-trait = "0.1"
jsonwebtoken = "9"
bcrypt = "0.17"
totp-rs = { version = "5", features = ["otpauth", "gen_secret"] }
casbin = { version = "2", default-features = false, features = ["runtime-tokio", "incremental"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
moka = { version = "0.12", features = ["future"] }
config = { version = "0.15", default-features = false, features = ["yaml"] }
clap = { version = "4", features = ["derive"] }
http = "1"
regex = "1"
png = "0.17"
rsa = { version = "0.9", features = ["sha2"] }
sha1 = { version = "0.10", features = ["oid"] }
x509-cert = { version = "0.2", features = ["pem"] }
subtle = "2"
quick-xml = "0.42"
chrono-tz = "0.10"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "service", "tokio", "http1", "http2"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "warn"
large_enum_variant = "allow"

[profile.dev.package."*"]
opt-level = 1
